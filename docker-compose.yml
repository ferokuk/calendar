services:
  # Обновляет расписание каждые 6 часов; после ошибок повторяет в фоне через 1–15 минут
  schedule:
    build: .
    command: ["./schedule-entrypoint.sh"]
    env_file: .env
    volumes:
      - ./calendars:/app/calendars
      - ./data:/app/data
    restart: unless-stopped

  # Telegram-бот для домашки
  homework-bot:
    build: .
    command: ["uv", "run", "--frozen", "--no-dev", "--no-sync", "python", "homework-bot.py"]
    env_file: .env
    volumes:
      - ./calendars:/app/calendars
      - ./data:/app/data
    restart: unless-stopped
