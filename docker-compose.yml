services:
  # Обновляет расписание из РУЗ каждые 6 часов (cron внутри контейнера)
  schedule:
    build: .
    command: ["./schedule-entrypoint.sh"]
    env_file: .env
    volumes:
      - /opt/ruz-calendar/calendars:/app/calendars
      - /opt/ruz-calendar/data:/app/data
    restart: unless-stopped

  # Telegram-бот для домашки
  homework-bot:
    build: .
    command: ["uv", "run", "--frozen", "--no-dev", "--no-sync", "python", "homework-bot.py"]
    env_file: .env
    volumes:
      - /opt/ruz-calendar/calendars:/app/calendars
      - /opt/ruz-calendar/data:/app/data
    restart: unless-stopped
